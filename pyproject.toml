# Основные сведения о проекте и библиотеки, нужные для запуска API.
[project]
name = "ai-data-analyst"
version = "0.1.0"
description = "AI analyst for IndustrialFlow sales data: deterministic metrics, anomaly detection and LLM tool calling"
readme = "README.md"
# Ограничение проверяется при выборе Python для окружения проекта.
requires-python = ">=3.12"
# Нижние границы версий; точные версии всех пакетов записаны в uv.lock.
dependencies = [
    "alembic>=1.16,<2",            # Версионированные миграции схемы PostgreSQL.
    "fastapi>=0.142.2",            # Маршруты API, проверка данных, страница /docs.
    "openai>=3.24.0,<4",           # Официальный SDK: Responses API, вызов функций, строгая схема.
    "pandas>=3,<4",                # Независимый эталон evals (этап 09): расчёт из CSV.
    "plotly>=6.3,<8",             # Interactive charts; exact money labels come from the API.
    "psycopg[binary]>=3.2,<4",     # Драйвер PostgreSQL 3-й версии для SQLAlchemy.
    "pydantic-settings>=2.15.0",   # Настройки из переменных окружения и .env.
    "scikit-learn>=1.7,<2",
    "sqlalchemy>=2.0,<3",          # Модели таблиц, соединения, сессии и транзакции.
    "streamlit>=1.50,<2",         # Local dashboard, agent questions and saved report UI.
    "uvicorn[standard]>=0.54.0",   # ASGI-сервер, который слушает порт и вызывает app.
]

# Политика зависимостей: в lock попадают только выпуски старше двух недель.
# uv не видит файлы PyPI новее этой даты. При обновлении зависимостей сдвигай
# дату не ближе чем на 14 дней к текущему дню.
[tool.uv]
exclude-newer = "2026-10-06T00:00:00Z"

# Инструменты разработки: uv sync устанавливает группу dev по умолчанию,
# а в будущий production-образ она не попадёт.
[dependency-groups]
dev = [
    "httpx2>=2.13.1",   # HTTP-клиент, на котором работает TestClient в Starlette 1.7+.
    "mypy>=2.4.0",      # Статическая проверка типов.
    "pytest>=9.1.1",    # Находит и запускает автоматические тесты.
    "pytest-cov>=6",
    "ruff>=0.16.10",    # Линтер и форматировщик кода.
]

# Pytest ищет тесты в tests/ и добавляет корень проекта в путь импортов:
# без pythonpath строка «from app.main import app» в тестах не найдёт пакет app.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Неизвестный marker считается ошибкой, а не тихо пропущенной проверкой.
addopts = "--strict-markers"
markers = [
    "integration: tests on a real PostgreSQL from TEST_DATABASE_URL (database name must end with _test)",
    "real_auth: run through the real API token check instead of the test analyst",
]

# Ruff проверяет код с учётом синтаксиса Python 3.12.
[tool.ruff]
target-version = "py312"
line-length = 88

# E — стиль, F — ошибки кода, I — порядок импортов, UP — современный Python,
# B — типичные ловушки вроде изменяемого значения аргумента по умолчанию.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Модули PDF-гайда — в основном текст на двух языках: длинные строки
# естественного языка не переносим ради лимита 88 символов.
[tool.ruff.lint.per-file-ignores]
"scripts/guide/*.py" = ["E501"]

# Строгий режим: у каждой функции должны быть аннотации, Any не просачивается.
# Плагин Pydantic объясняет mypy, как устроены поля моделей и настроек.
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

# Scikit-learn does not ship typing metadata; keep this exception vendor-only.
[[tool.mypy.overrides]]
module = ["sklearn.ensemble"]
ignore_missing_imports = true

# Pandas (the independent eval oracle) ships no typing metadata either.
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

# Plotly has no typing metadata; keep the exception limited to its package.
[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true

# Coverage of app/ and ui/ by lines and branches. CI runs pytest --cov and
# fails below the threshold; it was 93% when the gate was introduced.
[tool.coverage.run]
source = ["app", "ui"]
branch = true

[tool.coverage.report]
fail_under = 90
skip_covered = true
show_missing = true
