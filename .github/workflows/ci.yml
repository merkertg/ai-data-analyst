# CI and delivery: the checks that run locally, a dependency audit, a Docker
# stand smoke test and publication of the tested image to GHCR.
name: CI

# A local git commit does not start CI: a push or a pull request does.
# A version tag v1.2.3 publishes the same tested image under that version.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Jobs only read the repository; publish alone may write packages.
permissions:
  contents: read

# A new push to the same PR cancels its outdated run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A PostgreSQL of this run only: tests may reset its schema.
    # The image is pinned by the same digest as in compose.yaml.
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: analyst
          POSTGRES_PASSWORD: analyst_ci
          POSTGRES_DB: industrialflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U analyst -d industrialflow_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Alembic below and the integration tests use the same *_test database.
      DATABASE_URL: postgresql+psycopg://analyst:analyst_ci@127.0.0.1:5432/industrialflow_test
      TEST_DATABASE_URL: postgresql+psycopg://analyst:analyst_ci@127.0.0.1:5432/industrialflow_test
    steps:
      # Actions are pinned to a full commit SHA: a tag can move, a SHA cannot.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails if uv.lock does not match pyproject.toml.
      - name: Install locked dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run --locked ruff check .

      - name: Ruff format
        run: uv run --locked ruff format --check .

      - name: Mypy
        run: uv run --locked mypy app ui tests migrations

      # The schema is built only by migrations, exactly as for a user.
      - name: Apply migrations
        run: uv run --locked alembic upgrade head

      # A forgotten migration stops CI here.
      - name: Check models match migrations
        run: uv run --locked alembic check

      - name: Check downgrade and upgrade
        run: |
          uv run --locked alembic downgrade base
          uv run --locked alembic upgrade head

      # GitHub sets CI=true: without TEST_DATABASE_URL integration tests fail
      # instead of being skipped. Coverage below the threshold in pyproject.toml
      # (line and branch) fails the step.
      - name: Pytest with coverage
        run: |
          mkdir -p reports
          uv run --locked pytest --cov --cov-report=term --cov-report=xml:reports/coverage.xml

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('reports/coverage.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: reports/coverage.xml
          retention-days: 7

  # Known vulnerabilities in the locked runtime dependencies. A finding that is
  # not in scripts/audit-exceptions.json, or an expired exception, fails here.
  audit:
    name: Audit runtime dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          python-version: "3.12"

      - name: Audit locked runtime dependencies
        run: uv run --no-project --python 3.12 python scripts/audit_dependencies.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: reports/
          if-no-files-found: warn
          retention-days: 7

  # The same commands a user runs: build the image, start the whole stand,
  # check it end to end, re-create it and check that the data survived.
  container:
    name: Build and smoke test Docker
    needs: [checks, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Compose gets explicit values: there is no .env in CI.
    env:
      APP_IMAGE: ai-data-analyst:ci
      POSTGRES_PASSWORD: container_ci
      LLM_PROVIDER: mock
      OPENAI_API_KEY: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag ai-data-analyst:ci .

      # A healthy stand would not reveal a root user or development tools.
      - name: Check runtime user and excluded development tools
        run: |
          docker run --rm --entrypoint python ai-data-analyst:ci -c '
          import importlib.util, os, shutil
          assert os.getuid() == 10001 and os.getgid() == 10001
          assert all(importlib.util.find_spec(name) is None for name in ("pytest", "ruff", "mypy"))
          assert shutil.which("uv") is None
          print("OK runtime: UID/GID 10001; pytest, Ruff, mypy and uv excluded")
          '

      # --no-build: the stand runs exactly the image built above.
      - name: Start the stand
        run: docker compose up --no-build --detach --wait --wait-timeout 180

      # The token is read from the bootstrap volume, masked in the log and
      # passed through the environment, never as a command-line argument.
      - name: Smoke test API, agent and interface
        run: |
          token="$(docker compose exec -T ui cat /run/ai-data-analyst/ui_token)"
          echo "::add-mask::$token"
          SMOKE_TOKEN="$token" python3 scripts/smoke_stack.py \
            --api http://127.0.0.1:8001 --ui http://127.0.0.1:8502

      - name: Re-create containers and check persistence
        run: |
          docker compose down
          docker compose up --no-build --detach --wait --wait-timeout 180
          docker compose logs --no-log-prefix bootstrap | tail -n 1 | tee bootstrap.json
          python3 -c 'import json; r = json.load(open("bootstrap.json")); assert r["demo_data"] == "already present" and r["ui_token"] == "kept", r'
          token="$(docker compose exec -T ui cat /run/ai-data-analyst/ui_token)"
          echo "::add-mask::$token"
          SMOKE_TOKEN="$token" python3 scripts/smoke_stack.py \
            --api http://127.0.0.1:8001 --ui http://127.0.0.1:8502

      - name: Export tested image
        if: ${{ github.event_name == 'push' }}
        run: |
          mkdir -p image-artifact
          docker save ai-data-analyst:ci | gzip > image-artifact/ai-data-analyst.tar.gz

      - name: Upload tested image
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image
          path: image-artifact/
          retention-days: 1

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Remove the test stand
        if: always()
        run: docker compose down --volumes --remove-orphans

  # Publishes the image that passed the smoke test, without rebuilding it:
  # main → :main and :sha-<commit>; tag v1.2.3 → :v1.2.3 and :sha-<commit>.
  publish:
    name: Publish tested image to GHCR
    needs: container
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A version tag must look like v1.2.3 and point at a commit of main.
      - name: Validate version tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must look like v1.2.3"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag is not on main"; exit 1; }

      - name: Download tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-image
          path: image-artifact

      - name: Load tested image
        run: gunzip -c image-artifact/ai-data-analyst.tar.gz | docker load

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=("sha-${GITHUB_SHA::7}")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tags+=("$GITHUB_REF_NAME"); else tags+=("main"); fi
          for tag in "${tags[@]}"; do
            docker tag ai-data-analyst:ci "$image:$tag"
            docker push "$image:$tag"
          done
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image:${tags[0]}")"
          {
            echo "### Published image"
            echo
            for tag in "${tags[@]}"; do echo "- \`$image:$tag\`"; done
            echo "- digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
