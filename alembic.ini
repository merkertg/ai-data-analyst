# Настройки Alembic. Адрес базы здесь не хранится: env.py берёт его
# из DATABASE_URL (окружение или .env), а тесты передают свой отдельно.
[alembic]
script_location = %(here)s/migrations
# Корень проекта в sys.path: env.py импортирует пакет app.
prepend_sys_path = %(here)s
path_separator = os
# Файлы миграций: 0001_initial_schema.py — номер и короткое описание.
file_template = %%(rev)s_%%(slug)s

# Журналы: Alembic сообщает о выполненных миграциях, SQLAlchemy молчит.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
