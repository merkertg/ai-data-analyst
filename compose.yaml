# Локальный стенд этапа 02: PostgreSQL для разработки и отдельная тестовая БД.
# Настройки берутся из .env (образец — .env.example).
name: ai-data-analyst

# Образ закреплён по digest: тег postgres:17 на Docker Hub можно перезаписать.
# Тот же digest использует CI и первый проект.
x-postgres-image: &postgres-image postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3

services:
  db:
    image: *postgres-image
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-analyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Скопируй .env.example в .env и укажи POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-industrialflow}
    ports:
      # Только 127.0.0.1: база недоступна из локальной сети.
      # 5436, а не 5432: не конфликтуем с другими PostgreSQL на этом Mac.
      - "127.0.0.1:${POSTGRES_PORT:-5436}:5432"
    volumes:
      # Обычный down не удаляет том: данные переживают пересоздание контейнера.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # TCP проверяется после инициализации, отдельно от временного init-сервера.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Одноразовая БД для интеграционных тестов: запускается только с --profile test.
  # Имя заканчивается на _test — тесты отказываются сбрасывать другие базы.
  db-test:
    profiles: [test]
    image: *postgres-image
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst_test
      POSTGRES_DB: industrialflow_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5437}:5432"
    # Данные хранятся в памяти и исчезают при остановке контейнера.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U analyst -d industrialflow_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres_data:
